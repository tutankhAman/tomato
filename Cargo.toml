[package]
name = "tomato"
version = "0.1.0"
edition = "2024"
description = "A sticky, always-on-top Pomodoro timer and todo tracker for Linux"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
gtk4 = { version = "0.11.4", features = ["v4_10"] }
gtk4-layer-shell = { version = "0.8.0", features = ["v1_3"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }
notify-rust = "4.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"

[profile.release]
opt-level = 3
lto = true
strip = true
