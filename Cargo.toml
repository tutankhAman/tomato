[package]
name = "tomato"
version = "0.1.0"
edition = "2024"
description = "A sticky, always-on-top Pomodoro timer and todo tracker for Linux"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.44", features = ["serde"] }
dirs = "6.0.0"
gtk4 = { version = "0.11.4", features = ["v4_10"] }
gtk4-layer-shell = { version = "0.8.0", features = ["v1_3"] }
glib = "0.22.8"
gdk4 = "0.11.4"
gdk4-wayland = { version = "0.11.4", features = ["wayland_crate"] }
wayland-client = "0.31.14"
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
cairo-rs = "0.22.0"
pango = "0.22.8"
libadwaita = { version = "0.9.2", features = ["v1_5"] }
notify-rust = "4.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.4"
ksni = "0.2.2"


[dev-dependencies]
gtk4 = { version = "0.11.4", features = ["v4_10"] }

[profile.release]
lto = true
strip = true
