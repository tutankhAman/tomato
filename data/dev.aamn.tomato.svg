<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5253"/>
    </linearGradient>
    <linearGradient id="stem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ed573"/>
      <stop offset="100%" stop-color="#26af5f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d7f75b"/>
      <stop offset="100%" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Container background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#0e0f14" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- Tomato Body -->
  <circle cx="64" cy="70" r="34" fill="url(#bg)"/>
  
  <!-- Progress Ring -->
  <circle cx="64" cy="70" r="33" fill="none" stroke="url(#ring)" stroke-width="3.5" stroke-dasharray="150 60" stroke-linecap="round" transform="rotate(-90 64 70)"/>

  <!-- Stem & Leaves -->
  <path d="M64 36 C64 30 69 26 73 25 C69 31 64 36 64 36 Z" fill="url(#stem)"/>
  <path d="M64 38 C56 34 47 38 52 43 C58 43 62 39 64 38 Z" fill="url(#stem)"/>
  <path d="M64 38 C72 34 81 38 76 43 C70 43 66 39 64 38 Z" fill="url(#stem)"/>
  <circle cx="64" cy="38" r="3.5" fill="#2ed573"/>
</svg>
